            { id: 303, projectId: 3, title: 'สรุปเล่มรายงานวิจัยส่งผู้บริหาร', description: 'รวบรวม Chart และข้อเสนอแนะเชิงกลยุทธ์', assigneeId: 1, status: 'todo', priority: 'urgent', startDate: '2026-11-20', dueDate: '2026-11-26', createdAt: '2026-11-19', comments: [] },
            { id: 304, projectId: 3, title: 'ออกแบบสไลด์นำเสนอแผนงานปี 2027', description: 'จัดทำ Keynote สำหรับเสนอที่ประชุมใหญ่ประจำปี', assigneeId: 2, status: 'in_progress', priority: 'medium', startDate: '2026-11-15', dueDate: '2026-11-22', createdAt: '2026-11-14', comments: [] }

        // System State
        let users = [];
        let projects = [];
        let tasks = [];
        let currentUserId = 1; // Default: Admin
        let activeMenu = 'dashboard'; // 'dashboard', 'projects', 'global_calendar', 'team', 'users', 'role_matrix', 'project_detail'
        let currentProjectId = null;
        let projectTab = 'kanban'; // 'kanban', 'list', 'timeline', 'calendar'

        // Global Calendar / Timeline Controls State
        let calendarCurrentMonth = '2026-11'; // YYYY-MM
        let timelineZoom = 'normal'; // 'compact', 'normal', 'wide'
        let timelineColorMode = 'project'; // 'project', 'status'
        let viewFilters = { project: 'all', status: 'all', assignee: 'all' };

        // Today Reference Date: Nov 20, 2026
        const TODAY_STR = '2026-11-20';

        // Initialize App
        window.onload = function () {
            loadInitialData();
            renderRoleSwitcher();
            switchMenu('dashboard');
        };

        // ==========================================
        // DATA PERSISTENCE & HELPERS
        // ==========================================
        function loadInitialData() {
            const storedUsers = localStorage.getItem('tf_users');
            const storedProjects = localStorage.getItem('tf_projects');
            const storedTasks = localStorage.getItem('tf_tasks');

            users = storedUsers ? JSON.parse(storedUsers) : [...DEFAULT_USERS];
            projects = storedProjects ? JSON.parse(storedProjects) : [...DEFAULT_PROJECTS];
            tasks = storedTasks ? JSON.parse(storedTasks) : [...DEFAULT_TASKS];

            saveData();
        }

        function saveData() {
            localStorage.setItem('tf_users', JSON.stringify(users));
            localStorage.setItem('tf_projects', JSON.stringify(projects));
            localStorage.setItem('tf_tasks', JSON.stringify(tasks));
        }

        function resetDataToSample() {
            if (confirm('คุณต้องการรีเซ็ตข้อมูลทั้งหมดกลับเป็นค่าเริ่มต้น (พฤศจิกายน 2569) ใช่หรือไม่?')) {
                localStorage.removeItem('tf_users');
                localStorage.removeItem('tf_projects');
                localStorage.removeItem('tf_tasks');
                loadInitialData();
                showToast('รีเซ็ตข้อมูลตัวอย่างเรียบร้อยแล้ว', 'success');
                switchMenu(activeMenu);
            }
        }

        function getCurrentUser() {
            return users.find(u => u.id === currentUserId) || users[0];
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');

            const bgColors = {
                success: 'bg-emerald-600 text-white',
                error: 'bg-rose-600 text-white',
                warning: 'bg-amber-500 text-white',
                info: 'bg-slate-800 text-white'
            };
            const icons = {
                success: 'fa-circle-check',
                error: 'fa-circle-xmark',
                warning: 'fa-triangle-exclamation',
                info: 'fa-circle-info'
            };

            toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl transition-all duration-300 transform translate-y-2 opacity-0 text-sm font-medium ${bgColors[type] || bgColors.info}`;
            toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.info} text-base"></i><span>${message}</span>`;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // ==========================================
        // ROLE & PERMISSIONS LOGIC (RBAC)
        // ==========================================
        function renderRoleSwitcher() {
            const container = document.getElementById('role-switcher-buttons');
            const user = getCurrentUser();

            container.innerHTML = users.map(u => {
                const isActive = u.id === currentUserId;
                let activeStyle = '';
                if (isActive) {
                    if (u.role === 'admin') activeStyle = 'bg-purple-600 text-white shadow-sm ring-2 ring-purple-300';
                    else if (u.role === 'supervisor') activeStyle = 'bg-indigo-600 text-white shadow-sm ring-2 ring-indigo-300';
                    else activeStyle = 'bg-emerald-600 text-white shadow-sm ring-2 ring-emerald-300';
                } else {
                    activeStyle = 'bg-white text-slate-700 hover:bg-slate-200 border border-slate-200';
                }

                return `
                    <button onclick="switchRole(${u.id})" class="px-2.5 py-1 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all ${activeStyle}">
                        <span class="w-5 h-5 rounded-full bg-slate-900/20 text-current flex items-center justify-center text-[10px] font-bold">${u.avatar}</span>
                        <span>${u.name.split(' ')[0]}</span>
                        <span class="text-[10px] opacity-80 font-normal">(${u.badge})</span>
                    </button>
                `;
            }).join('');
        }

        function switchRole(userId) {
            currentUserId = userId;
            renderRoleSwitcher();
            showToast(`สลับบทบาทเป็น: ${getCurrentUser().name} (${getCurrentUser().badge})`, 'info');
            renderSidebar();
            switchMenu(activeMenu);
        }

        function canManageUsers() { return getCurrentUser().role === 'admin'; }
        function canCreateProject() { return getCurrentUser().role === 'admin' || getCurrentUser().role === 'supervisor'; }

        function canEditTask(task) {
            const user = getCurrentUser();
            if (user.role === 'admin' || user.role === 'supervisor') return true;
            return task.assigneeId === user.id;
        }

        function canDeleteTask(task) {
            const user = getCurrentUser();
            if (user.role === 'admin') return true;
            if (user.role === 'supervisor') return true;
            return false;
        }

        function validateTaskStatusMove(task, newStatus) {
            const user = getCurrentUser();
            // Staff restrictions

            if (quickAddBtn) {
                quickAddBtn.style.display = canCreateProject() ? 'inline-flex' : 'none';

            projectListContainer.innerHTML = projects.map(p => {
                const isActive = activeMenu === 'project_detail' && currentProjectId === p.id;
                const activeClass = isActive ? 'bg-indigo-950/80 text-white border-l-4 border-indigo-500 font-semibold pl-2' : 'text-slate-400 hover:bg-slate-800 hover:text-white';

                return `

                            </div>
                        </button>
                    </li>
                `;
            }).join('');

            // Highlight Active Nav Button
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white', 'shadow-md');
                btn.classList.add('text-slate-300');
            });

            const activeBtn = document.getElementById(`nav-${activeMenu}`);
            if (activeBtn) {
                activeBtn.classList.add('bg-indigo-600', 'text-white', 'shadow-md');
                activeBtn.classList.remove('text-slate-300');

        function switchMenu(menu, projectId = null) {

            currentProjectId = projectId;

                    subtitleEl.innerText = 'เฉพาะสิทธิ์ Admin: เพิ่ม แก้ไข และกำหนดบทบาทผู้ใช้งาน';

                case 'project_detail':

                        subtitleEl.innerText = project.description;

                    break;

                            <span class="font-semibold text-slate-500"><i class="fa-solid fa-filter mr-1"></i>ตัวกรอง:</span>
                            
                            <!-- Project Filter -->
                            <select onchange="updateViewFilter('project', this.value)" class="px-3 py-1.5 rounded-lg border border-slate-200 bg-slate-50 font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="all" ${viewFilters.project === 'all' ? 'selected' : ''}>ทุกโปรเจค</option>
                                ${projects.map(p => `<option value="${p.id}" ${viewFilters.project == p.id ? 'selected' : ''}>${p.name}</option>`).join('')}
                            </select>

                            <!-- Status Filter -->
                            <select onchange="updateViewFilter('status', this.value)" class="px-3 py-1.5 rounded-lg border border-slate-200 bg-slate-50 font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="all" ${viewFilters.status === 'all' ? 'selected' : ''}>ทุกสถานะ</option>
                                <option value="todo" ${viewFilters.status === 'todo' ? 'selected' : ''}>รอดำเนินการ</option>
                                <option value="in_progress" ${viewFilters.status === 'in_progress' ? 'selected' : ''}>กำลังทำ</option>
                                <option value="review" ${viewFilters.status === 'review' ? 'selected' : ''}>รอตรวจสอบ</option>
                                <option value="completed" ${viewFilters.status === 'completed' ? 'selected' : ''}>เสร็จสิ้น</option>
                            </select>

                            <!-- Assignee Filter -->
                            <select onchange="updateViewFilter('assignee', this.value)" class="px-3 py-1.5 rounded-lg border border-slate-200 bg-slate-50 font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="all" ${viewFilters.assignee === 'all' ? 'selected' : ''}>ทุกคนในทีม</option>
                                ${users.map(u => `<option value="${u.id}" ${viewFilters.assignee == u.id ? 'selected' : ''}>${u.name}</option>`).join('')}
                            </select>

                            ${projectTab === 'timeline' ? `
                                <!-- Color Mode Toggle -->
                                <div class="ml-auto flex items-center gap-1.5 bg-slate-100 p-1 rounded-lg border border-slate-200">
                                    <span class="text-[11px] text-slate-500 font-semibold px-1">สีแถบ:</span>
                                    <button onclick="setTimelineColorMode('project')" class="px-2 py-0.5 rounded text-[11px] font-semibold ${timelineColorMode === 'project' ? 'bg-white shadow text-slate-800' : 'text-slate-500'}">ตามโปรเจค</button>
                                    <button onclick="setTimelineColorMode('status')" class="px-2 py-0.5 rounded text-[11px] font-semibold ${timelineColorMode === 'status' ? 'bg-white shadow text-slate-800' : 'text-slate-500'}">ตามสถานะ</button>
                                </div>
                            ` : ''}
                        </div>
                    </div>

                    <!-- View Container -->
                    <div id="calendar-timeline-view-body" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 overflow-hidden">
                        <!-- Rendered by JS below -->
                    </div>
                </div>
            `;

            // Default to Calendar view if tab not set properly
            if (projectTab !== 'calendar' && projectTab !== 'timeline') {
                projectTab = 'calendar';
            }

            const bodyContainer = document.getElementById('calendar-timeline-view-body');
            if (projectTab === 'calendar') {
                renderCalendarComponent(bodyContainer, filteredTasks);
            } else {
                renderTimelineComponent(bodyContainer, filteredTasks);
            }
        }

        function setGlobalViewMode(mode) {
            projectTab = mode;
            renderGlobalCalendarTimelineView(document.getElementById('main-content'));
        }

        function updateViewFilter(key, value) {
            viewFilters[key] = value;
            renderGlobalCalendarTimelineView(document.getElementById('main-content'));
        }

        function changeMonth(delta) {
            const [year, month] = calendarCurrentMonth.split('-').map(Number);
            let date = new Date(year, month - 1 + delta, 1);
            let y = date.getFullYear();
            let m = String(date.getMonth() + 1).padStart(2, '0');
            calendarCurrentMonth = `${y}-${m}`;
            renderGlobalCalendarTimelineView(document.getElementById('main-content'));
        }

        function resetToTodayMonth() {
            calendarCurrentMonth = '2026-11';
            renderGlobalCalendarTimelineView(document.getElementById('main-content'));
        }

        function setTimelineColorMode(mode) {
            timelineColorMode = mode;
            renderGlobalCalendarTimelineView(document.getElementById('main-content'));
        }

        // ==========================================
        // CALENDAR COMPONENT (CONTINUOUS MULTI-DAY BARS)
        // ==========================================
        function renderCalendarComponent(container, taskList) {
            const [year, month] = calendarCurrentMonth.split('-').map(Number);

            // Generate full calendar grid days (including padding from prev/next month)
            const firstDayOfMonth = new Date(year, month - 1, 1);
            const lastDayOfMonth = new Date(year, month, 0);

            const startDayOfWeek = firstDayOfMonth.getDay(); // 0 = Sunday
            const totalDaysInMonth = lastDayOfMonth.getDate();

            // Build Array of Weeks (7 days per week)
            let weeks = [];
            let currentDayCount = 1 - startDayOfWeek;

            // Produce 5 or 6 weeks to cover month
            for (let w = 0; w < 6; w++) {
                let weekDays = [];
                for (let d = 0; d < 7; d++) {
                    let dayDate = new Date(year, month - 1, currentDayCount);
                    let dateStr = formatDateToYYYYMMDD(dayDate);
                    let isCurrentMonth = dayDate.getMonth() === month - 1;
                    let isToday = dateStr === TODAY_STR;

                    weekDays.push({
                        date: dayDate,
                        dateStr: dateStr,
                        dayNum: dayDate.getDate(),
                        isCurrentMonth: isCurrentMonth,
                        isToday: isToday,
                        isWeekend: d === 0 || d === 6
                    });
                    currentDayCount++;
                }
                weeks.push(weekDays);
                if (currentDayCount > totalDaysInMonth && w >= 4) break;
            }

            const dayNames = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];

            container.innerHTML = `
                <div class="select-none min-w-[768px]">
                    <!-- Day Headers -->
                    <div class="grid grid-cols-7 border-b border-slate-200 bg-slate-50 rounded-t-xl text-xs font-bold text-slate-600 text-center py-2.5">
                        ${dayNames.map((d, i) => `
                            <div class="${i === 0 || i === 6 ? 'text-rose-500' : ''}">${d}</div>
                        `).join('')}
                    </div>

                    <!-- Calendar Weeks Container -->
                    <div class="divide-y divide-slate-200 border-b border-slate-200">
                        ${weeks.map((week, weekIdx) => {
                // Calculate overlapping continuous multi-day task segments for this week row
                const weekStartDate = week[0].dateStr;
                const weekEndDate = week[6].dateStr;

                // Filter tasks active in this week
                const weekTasks = taskList.filter(t => t.startDate <= weekEndDate && t.dueDate >= weekStartDate);

                // Sort tasks by start date & duration for clean stacking
                weekTasks.sort((a, b) => {
                    if (a.startDate !== b.startDate) return a.startDate.localeCompare(b.startDate);
                    return (new Date(b.dueDate) - new Date(b.startDate)) - (new Date(a.dueDate) - new Date(a.startDate));
                });

                // Allocate stacking rows (lanes) for this week
                let lanes = []; // Array of arrays containing tasks
                weekTasks.forEach(task => {
                    let placed = false;
                    for (let l = 0; l < lanes.length; l++) {
                        // Check if task overlaps with any task in lane `l` within this week
                        let overlap = lanes[l].some(existing => {
                            return !(task.dueDate < existing.startDate || task.startDate > existing.dueDate);
                        });
                        if (!overlap) {
                            lanes[l].push(task);
                            placed = true;
                            break;
                        }
                    }
                    if (!placed) {
                        lanes.push([task]);
                    }
                });

                return `
                                <div class="relative min-h-[120px] bg-white">
                                    <!-- Background Date Cells Grid -->
                                    <div class="grid grid-cols-7 h-full absolute inset-0 divide-x divide-slate-100 pointer-events-none">
                                        ${week.map(day => `
                                            <div class="p-1 flex flex-col justify-between ${!day.isCurrentMonth ? 'bg-slate-50/70 opacity-40' : day.isWeekend ? 'bg-slate-50/40' : ''}">
                                                <div class="flex items-center justify-between">
                                                    <span class="text-xs font-semibold inline-flex items-center justify-center w-6 h-6 rounded-full ${day.isToday ? 'bg-indigo-600 text-white font-bold ring-4 ring-indigo-100' : day.isWeekend ? 'text-rose-500' : 'text-slate-700'}">
                                                        ${day.dayNum}
                                                    </span>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>

                                    <!-- Interactive Date Cell Add Task Buttons Layer -->
                                    <div class="grid grid-cols-7 h-full absolute inset-0 divide-x divide-transparent">
                                        ${week.map(day => `
                                            <div class="relative group p-1">
                                                ${canCreateProject() || getCurrentUser().role === 'admin' ? `
                                                    <button onclick="openCreateTaskModal('${day.dateStr}')" class="opacity-0 group-hover:opacity-100 transition-opacity absolute bottom-1 right-1 w-6 h-6 rounded-lg bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white flex items-center justify-center text-xs shadow-sm z-10" title="เพิ่มงานวันที่ ${day.dateStr}">
                                                        <i class="fa-solid fa-plus"></i>
                                                    </button>
                                                ` : ''}
                                            </div>
                                        `).join('')}
                                    </div>

                                    <!-- Multi-day Continuous Spanning Task Bars Layer -->
                                    <div class="relative pt-8 pb-2 px-0.5 space-y-1 z-10">
                                        ${lanes.slice(0, 3).map(lane => {
                    return lane.map(t => {
                        const prj = projects.find(p => p.id === t.projectId);
                        const barColor = prj ? prj.color : '#3b82f6';

                        // Calculate column span within 0 to 6 index
                        let startCol = 0;
                        let endCol = 6;

                        for (let i = 0; i < 7; i++) {
                            if (week[i].dateStr === t.startDate) startCol = i;
                            if (week[i].dateStr === t.dueDate) endCol = i;
                        }

                        if (t.startDate < week[0].dateStr) startCol = 0;
                        if (t.dueDate > week[6].dateStr) endCol = 6;

                        const isStartSpanning = t.startDate >= week[0].dateStr;
                        const isEndSpanning = t.dueDate <= week[6].dateStr;

                        const roundedClasses = `
                                                    ${isStartSpanning ? 'rounded-l-lg ml-1' : 'rounded-l-none'} 
                                                    ${isEndSpanning ? 'rounded-r-lg mr-1' : 'rounded-r-none'}
                                                `;

                        const isOverdue = t.dueDate < TODAY_STR && t.status !== 'completed';
                        const totalDays = calculateDaysBetween(t.startDate, t.dueDate);

                        return `
                                                    <div style="margin-left: calc(${startCol} * (100% / 7)); width: calc((${(endCol - startCol + 1)}) * (100% / 7));" class="pr-1">
                                                        <div onclick="openEditTaskModal(${t.id})" 
                                                             style="background-color: ${barColor};" 
                                                             class="h-6 px-2 text-white text-xs font-medium ${roundedClasses} shadow-sm flex items-center justify-between cursor-pointer hover:brightness-110 hover:shadow-md transition-all overflow-hidden ${isOverdue ? 'ring-2 ring-rose-500 animate-pulse' : ''}">
                                                            <div class="flex items-center gap-1.5 truncate">
                                                                <span class="w-1.5 h-1.5 rounded-full bg-white flex-shrink-0"></span>
                                                                <span class="truncate font-medium text-[11px]">${t.title}</span>
                                                            </div>
                                                            <span class="text-[9px] bg-black/20 px-1.5 py-0.2 rounded font-mono flex-shrink-0 ml-1">
                                                                ${totalDays}วัน
                                                            </span>
                                                        </div>
                                                    </div>
                                                `;
                    }).join('');
                }).join('')}

                                        <!-- Indicator if more tasks than 3 -->
                                        ${lanes.length > 3 ? `
                                            <div class="text-[10px] font-bold text-slate-400 text-center py-0.5">
                                                + อีก ${lanes.length - 3} งานย่อย
                                            </div>
                                        ` : ''}
                                    </div>
                                </div>
                            `;
            }).join('')}
                    </div>
                </div>
            `;
        }

        // ==========================================
        // TIMELINE / GANTT CHART COMPONENT
        // ==========================================
        function renderTimelineComponent(container, taskList) {
            const [year, month] = calendarCurrentMonth.split('-').map(Number);
            const totalDaysInMonth = new Date(year, month, 0).getDate();

            // Day column width depending on zoom
            const colWidths = { compact: 36, normal: 46, wide: 60 };
            const colWidth = colWidths[timelineZoom] || 46;

            let dayColumns = [];
            for (let d = 1; d <= totalDaysInMonth; d++) {
                let dateObj = new Date(year, month - 1, d);
                let dateStr = formatDateToYYYYMMDD(dateObj);
                let dayOfWeek = dateObj.getDay();
                let dayNamesShort = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
                dayColumns.push({
                    dayNum: d,
                    dateStr: dateStr,
                    dayOfWeekName: dayNamesShort[dayOfWeek],
                    isWeekend: dayOfWeek === 0 || dayOfWeek === 6,
                    isToday: dateStr === TODAY_STR
                });
            }

            container.innerHTML = `
                <div class="flex flex-col border border-slate-200 rounded-xl overflow-hidden bg-white">
                    <!-- Gantt Toolbar Controls -->
                    <div class="p-3 bg-slate-50 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3 text-xs">
                        <div class="flex items-center gap-2">
                            <span class="font-semibold text-slate-600"><i class="fa-solid fa-magnifying-glass-plus mr-1"></i>ขนาดตาราง:</span>
                            <button onclick="setTimelineZoom('compact')" class="px-2.5 py-1 rounded ${timelineZoom === 'compact' ? 'bg-indigo-600 text-white font-bold' : 'bg-white border text-slate-700 hover:bg-slate-100'}">กะทัดรัด</button>
                            <button onclick="setTimelineZoom('normal')" class="px-2.5 py-1 rounded ${timelineZoom === 'normal' ? 'bg-indigo-600 text-white font-bold' : 'bg-white border text-slate-700 hover:bg-slate-100'}">ปกติ</button>
                            <button onclick="setTimelineZoom('wide')" class="px-2.5 py-1 rounded ${timelineZoom === 'wide' ? 'bg-indigo-600 text-white font-bold' : 'bg-white border text-slate-700 hover:bg-slate-100'}">กว้าง</button>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="flex items-center gap-2">
                                <span class="w-3 h-3 rounded bg-indigo-600"></span><span class="text-slate-500">แถบงานปกติ</span>
                                <span class="w-3 h-3 rounded bg-rose-500 border ring-2 ring-rose-300"></span><span class="text-slate-500">เลยกำหนดส่ง</span>
                                <span class="w-0.5 h-4 bg-rose-600"></span><span class="text-rose-600 font-bold">เส้นวันนี้</span>
                            </div>
                        </div>
                    </div>

                    <!-- Scrollable Split Table -->
                    <div class="flex overflow-x-auto relative">
                        <!-- Left Sticky Task Info Column -->
                        <div class="sticky left-0 z-20 bg-white border-r border-slate-200 shadow-md flex-shrink-0 w-64 md:w-80">
                            <!-- Header -->
                            <div class="h-14 bg-slate-100 border-b border-slate-200 px-4 flex items-center font-bold text-xs text-slate-700 uppercase tracking-wider">
                                รายละเอียดงาน (${taskList.length})
                            </div>
                            <!-- Task List Side Column Rows -->
                            <div class="divide-y divide-slate-100">
                                ${taskList.map(t => {
                const prj = projects.find(p => p.id === t.projectId);
                const assignee = users.find(u => u.id === t.assigneeId);
                const isOverdue = t.dueDate < TODAY_STR && t.status !== 'completed';

                return `
                                        <div onclick="openEditTaskModal(${t.id})" class="h-12 px-3 flex items-center justify-between hover:bg-slate-50 cursor-pointer transition-colors">
                                            <div class="overflow-hidden space-y-0.5">
                                                <div class="flex items-center gap-1.5">
                                                    <span class="w-2 h-2 rounded-full flex-shrink-0" style="background-color: ${prj ? prj.color : '#94a3b8'}"></span>
                                                    <h5 class="text-xs font-semibold text-slate-800 truncate ${isOverdue ? 'text-rose-600' : ''}">${t.title}</h5>
                                                </div>
                                                <div class="text-[10px] text-slate-400 flex items-center gap-2">
                                                    <span>${prj ? prj.name : '-'}</span>
                                                </div>
                                            </div>
                                            <div class="flex items-center gap-1 flex-shrink-0">
                                                <span class="w-5 h-5 rounded-full bg-slate-200 text-slate-700 font-bold text-[9px] flex items-center justify-center">
                                                    ${assignee ? assignee.avatar : '?'}
                                                </span>
                                            </div>
                                        </div>
                                    `;
            }).join('')}
                            </div>
                        </div>

                        <!-- Right Timeline Grid Side -->
                        <div class="flex-1 min-w-max">
                            <!-- Timeline Header Rows -->
                            <div class="h-14 bg-slate-100 border-b border-slate-200 flex flex-col justify-end">
                                <div class="flex">
                                    ${dayColumns.map(day => `
                                        <div style="width: ${colWidth}px" class="flex-shrink-0 text-center border-r border-slate-200 py-1 ${day.isWeekend ? 'bg-slate-200/50' : ''} ${day.isToday ? 'bg-indigo-100 font-bold' : ''}">
                                            <div class="text-[10px] font-semibold text-slate-500 uppercase">${day.dayOfWeekName}</div>
                                            <div class="text-xs font-bold ${day.isToday ? 'text-indigo-700' : day.isWeekend ? 'text-rose-500' : 'text-slate-700'}">${day.dayNum}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <!-- Gantt Rows Container -->
                            <div class="divide-y divide-slate-100 relative">
                                <!-- TODAY INDICATOR VERTICAL LINE -->
                                ${(() => {
                    const todayIndex = dayColumns.findIndex(d => d.isToday);
                    if (todayIndex !== -1) {
                        const leftPos = (todayIndex * colWidth) + (colWidth / 2);
                        return `
                                            <div style="left: ${leftPos}px" class="absolute top-0 bottom-0 w-0.5 bg-rose-500 z-10 pointer-events-none flex flex-col items-center">
                                                <span class="bg-rose-600 text-white text-[9px] font-bold px-1 py-0.5 rounded shadow absolute -top-3 whitespace-nowrap">วันนี้</span>
                                            </div>
                                        `;
                    }
                    return '';
                })()}

                                <!-- Rows -->
                                ${taskList.map(t => {
                    const prj = projects.find(p => p.id === t.projectId);
                    const isOverdue = t.dueDate < TODAY_STR && t.status !== 'completed';

                    // Calculate bar position
                    let startIdx = dayColumns.findIndex(d => d.dateStr === t.startDate);
                    let endIdx = dayColumns.findIndex(d => d.dateStr === t.dueDate);

                    // Fallback for overflow dates outside current month
                    if (startIdx === -1 && t.startDate < dayColumns[0].dateStr) startIdx = 0;
                    if (endIdx === -1 && t.dueDate > dayColumns[dayColumns.length - 1].dateStr) endIdx = dayColumns.length - 1;

                    let barLeft = 0;
                    let barWidth = 0;
                    let isVisible = startIdx !== -1 || endIdx !== -1;

                    if (isVisible) {
                        if (startIdx === -1) startIdx = 0;
                        if (endIdx === -1) endIdx = dayColumns.length - 1;
                        barLeft = startIdx * colWidth;
                        barWidth = (endIdx - startIdx + 1) * colWidth;
                    }

                    // Bar Color Selection
                    let barBg = prj ? prj.color : '#3b82f6';
                    if (timelineColorMode === 'status') {
                        if (t.status === 'completed') barBg = '#10b981';
                        else if (t.status === 'review') barBg = '#f59e0b';
                        else if (t.status === 'in_progress') barBg = '#3b82f6';
                        else barBg = '#64748b';
                    }

                    const totalDays = calculateDaysBetween(t.startDate, t.dueDate);

                    return `
                                        <div class="h-12 relative flex items-center">
                                            <!-- Grid Column background guides -->
                                            <div class="absolute inset-0 flex pointer-events-none">
                                                ${dayColumns.map(day => `
                                                    <div style="width: ${colWidth}px" class="h-full border-r border-slate-100 flex-shrink-0 ${day.isWeekend ? 'bg-slate-50/70' : ''}"></div>
                                                `).join('')}
                                            </div>

                                            <!-- Gantt Multi-Day Bar -->
                                            ${isVisible ? `
                                                <div onclick="openEditTaskModal(${t.id})" 
                                                     style="left: ${barLeft + 2}px; width: ${barWidth - 4}px; background-color: ${barBg}" 
                                                     class="h-7 rounded-lg shadow-sm font-medium text-white text-xs px-2.5 flex items-center justify-between absolute z-10 cursor-pointer hover:brightness-110 hover:shadow-md transition-all overflow-hidden ${isOverdue ? 'ring-2 ring-rose-500 animate-pulse' : ''}">
                                                    <span class="truncate text-[11px] font-semibold">${t.title}</span>
                                                    <span class="text-[9px] bg-black/25 px-1.5 py-0.5 rounded font-mono ml-1 flex-shrink-0">${totalDays} วัน</span>
                                                </div>
                                            ` : ''}
                                        </div>
                                    `;
                }).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function setTimelineZoom(zoom) {
            timelineZoom = zoom;
            renderGlobalCalendarTimelineView(document.getElementById('main-content'));
        }

        // ==========================================
        // 4. PROJECT WORKSPACE (KANBAN, LIST, TIMELINE, CALENDAR)
        // ==========================================
        function renderProjectDetailView(container, project) {
            const prjTasks = tasks.filter(t => t.projectId === project.id);
            const doneTasks = prjTasks.filter(t => t.status === 'completed').length;
            const pct = prjTasks.length > 0 ? Math.round((doneTasks / prjTasks.length) * 100) : 0;

            container.innerHTML = `
                <div class="space-y-6">
                    <!-- Project Detail Header Banner -->
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm relative overflow-hidden">
                        <div class="absolute top-0 left-0 bottom-0 w-3" style="background-color: ${project.color}"></div>
                        <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 pl-2">
                            <div class="space-y-1">
                                <div class="flex items-center gap-3">
                                    <h2 class="text-xl font-bold text-slate-800">${project.name}</h2>
                                    <span class="text-xs px-3 py-1 rounded-full font-bold text-white" style="background-color: ${project.color}">${pct}% เสร็จสิ้น</span>
                                </div>
                                <p class="text-xs text-slate-500">${project.description}</p>
                            </div>

                            <div class="flex items-center gap-3">
                                ${canEditTask({ assigneeId: currentUserId }) || canCreateProject() ? `
                                    <button onclick="openCreateTaskModal(null, ${project.id})" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl flex items-center gap-2 shadow-sm transition-all">
                                        <i class="fa-solid fa-plus"></i>
                                        <span>เพิ่มงานในโปรเจคนี้</span>
                                    </button>
                                ` : ''}
                            </div>
                        </div>

                        <!-- Workspace Tab Switching -->
                        <div class="mt-6 pt-4 border-t border-slate-100 flex flex-wrap items-center justify-between gap-4">
                            <div class="flex items-center gap-2 bg-slate-100 p-1 rounded-xl border border-slate-200">
                                <button onclick="setProjectTab('kanban')" class="px-4 py-1.5 rounded-lg text-xs font-semibold transition-all ${projectTab === 'kanban' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'}">

        // DRAG AND DROP HANDLERS FOR KANBAN
        let draggedTaskId = null;

        function handleDragStart(e, taskId) {
            draggedTaskId = taskId;
            e.dataTransfer.setData('text/plain', taskId);
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function handleDrop(e, newStatus) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');

            if (!draggedTaskId) return;
            const task = tasks.find(t => t.id === draggedTaskId);
            if (!task) return;

            if (validateTaskStatusMove(task, newStatus)) {
                task.status = newStatus;
                saveData();
                showToast(`อัปเดตสถานะงานเป็น: ${getThaiStatusName(newStatus)}`, 'success');
                renderSidebar();
                switchMenu(activeMenu, currentProjectId);
            }
            draggedTaskId = null;
        }

            backdrop.classList.remove('hidden');
            setTimeout(() => {
                container.classList.remove('scale-95', 'opacity-0');
                container.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const backdrop = document.getElementById('modal-backdrop');
            const container = document.getElementById('modal-container');

            container.classList.remove('scale-100', 'opacity-100');
            container.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                backdrop.classList.add('hidden');
            }, 200);
        }

        function updateDurationCalculation() {
            const startStr = document.getElementById('task-form-startdate').value;
            const dueStr = document.getElementById('task-form-duedate').value;
            const badgeEl = document.getElementById('duration-badge-text');

            if (startStr && dueStr) {
                if (dueStr < startStr) {
                    badgeEl.className = 'px-2.5 py-1 rounded-full bg-rose-600 text-white font-mono';
                    badgeEl.innerText = 'วันกำหนดส่งต้องไม่น้อยกว่าวันเริ่ม';
                } else {
                    const days = calculateDaysBetween(startStr, dueStr);
                    badgeEl.className = 'px-2.5 py-1 rounded-full bg-indigo-600 text-white font-mono';
                    badgeEl.innerText = `${days} วัน`;
                }
            }
        }

        function submitCreateTask(e) {
            e.preventDefault();
            const startStr = document.getElementById('task-form-startdate').value;
            const dueStr = document.getElementById('task-form-duedate').value;

            if (dueStr < startStr) {
                showToast('วันกำหนดส่งต้องไม่น้อยกว่าวันเริ่มต้น', 'error');
                return;
            }

            const newTask = {
                id: Date.now(),
                projectId: parseInt(document.getElementById('task-form-project').value),
                title: document.getElementById('task-form-title').value,
                description: document.getElementById('task-form-desc').value,
                assigneeId: parseInt(document.getElementById('task-form-assignee').value),
                status: 'todo',
                priority: document.getElementById('task-form-priority').value,
                startDate: startStr,
                dueDate: dueStr,
                createdAt: TODAY_STR,
                comments: []
            };

            tasks.push(newTask);
            saveData();
            closeModal();
            showToast('สร้างงานใหม่สำเร็จเรียบร้อยแล้ว', 'success');
            renderSidebar();
            switchMenu(activeMenu, currentProjectId);
        }

        function submitEditTask(e, taskId) {
            e.preventDefault();
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            const newStatus = document.getElementById('edit-task-status').value;

            if (!validateTaskStatusMove(task, newStatus)) {
                return;
            }

            task.title = document.getElementById('edit-task-title').value;
            task.description = document.getElementById('edit-task-desc').value;
            task.assigneeId = parseInt(document.getElementById('edit-task-assignee').value);
            task.status = newStatus;
            task.priority = document.getElementById('edit-task-priority').value;
            task.startDate = document.getElementById('edit-task-startdate').value;
            task.dueDate = document.getElementById('edit-task-duedate').value;

            saveData();
            closeModal();
            showToast('อัปเดตข้อมูลงานสำเร็จ', 'success');
            renderSidebar();
            switchMenu(activeMenu, currentProjectId);
        }

        function addComment(taskId) {
            const input = document.getElementById('new-comment-input');
            const text = input.value.trim();
            if (!text) return;

            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.comments.push({
                    id: Date.now(),
                    userId: currentUserId,
                    text: text,
                    timestamp: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
                });
                saveData();
                openEditTaskModal(taskId);
                showToast('ส่งข้อความคอมเมนต์เรียบร้อยแล้ว', 'success');
            }
        }

        function approveTask(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.status = 'completed';
                saveData();
                closeModal();
                showToast(`อนุมัติงาน "${task.title}" สำเร็จแล้ว`, 'success');
                renderSidebar();
                switchMenu(activeMenu, currentProjectId);
            }
        }

        function rejectTask(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.status = 'in_progress';
                saveData();
                closeModal();
                showToast(`ส่งงาน "${task.title}" กลับไปแก้ไขเพิ่มเติม`, 'warning');
                renderSidebar();
                switchMenu(activeMenu, currentProjectId);
            }
        }

        function deleteTask(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (task && canDeleteTask(task)) {
                if (confirm(`คุณต้องการลบงาน "${task.title}" ใช่หรือไม่?`)) {
                    tasks = tasks.filter(t => t.id !== taskId);
                    saveData();
                    closeModal();
                    showToast('ลบงานเรียบร้อยแล้ว', 'info');
                    renderSidebar();
                    switchMenu(activeMenu, currentProjectId);
                }
            }
        }

                showToast(`อัปเดตสิทธิ์ของ ${user.name} เป็น ${badges[newRole]}`, 'success');
                renderRoleSwitcher();
            }
        }

        function deleteUser(userId) {
            if (confirm('คุณต้องการลบผู้ใช้งานคนนี้ใช่หรือไม่?')) {
                users = users.filter(u => u.id !== userId);
                saveData();
                showToast('ลบผู้ใช้งานเรียบร้อยแล้ว', 'info');
                renderRoleSwitcher();
                switchMenu('users');
            }
        }

        // ==========================================
        // FORMATTING & UTILITIES
        // ==========================================
        function calculateDaysBetween(startDateStr, dueDateStr) {
            const start = new Date(startDateStr);
            const due = new Date(dueDateStr);
            const diffTime = Math.abs(due - start);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
            return diffDays || 1;
        }

        function formatDateToYYYYMMDD(dateObj) {
            let y = dateObj.getFullYear();
            let m = String(dateObj.getMonth() + 1).padStart(2, '0');
            let d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function formatThaiDateShort(dateStr) {
            if (!dateStr) return '-';
            const [y, m, d] = dateStr.split('-');
            const thaiMonths = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            const thaiYear = parseInt(y) + 543;
            return `${parseInt(d)} ${thaiMonths[parseInt(m) - 1]} ${thaiYear.toString().substring(2)}`;
        }

        function getThaiMonthYearString(yearMonthStr) {
            const [y, m] = yearMonthStr.split('-');
            const thaiFullMonths = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
            return `${thaiFullMonths[parseInt(m) - 1]} ${parseInt(y) + 543}`;
        }

        function getThaiStatusName(status) {
            const names = { todo: 'รอดำเนินการ', in_progress: 'กำลังทำ', review: 'รอตรวจสอบ', completed: 'เสร็จสิ้น' };
            return names[status] || status;
        }

        function getStatusBadge(status) {
            const badges = {
                todo: '<span class="px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-700 text-[11px] font-semibold border border-slate-200">รอดำเนินการ</span>',
                in_progress: '<span class="px-2.5 py-0.5 rounded-full bg-indigo-100 text-indigo-700 text-[11px] font-semibold border border-indigo-200">กำลังทำ</span>',
                review: '<span class="px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-700 text-[11px] font-semibold border border-amber-200 animate-pulse">รอตรวจสอบ</span>',
                completed: '<span class="px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-700 text-[11px] font-semibold border border-emerald-200">เสร็จสิ้น</span>'
            };
            return badges[status] || status;
        }

        function getPriorityBadge(priority) {
            const badges = {
                low: '<span class="px-2 py-0.5 rounded bg-slate-100 text-slate-600 text-[10px] font-bold">ต่ำ</span>',
                medium: '<span class="px-2 py-0.5 rounded bg-sky-100 text-sky-700 text-[10px] font-bold">ปานกลาง</span>',
                high: '<span class="px-2 py-0.5 rounded bg-amber-100 text-amber-700 text-[10px] font-bold">สูง</span>',
                urgent: '<span class="px-2 py-0.5 rounded bg-rose-100 text-rose-700 text-[10px] font-bold">ด่วนที่สุด</span>'
            };
            return badges[priority] || priority;
        }
    </script>
